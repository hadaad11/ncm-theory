<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NCM Theory vs Dry</title>
<meta name="theme-color" content="#1F4E79">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Theory vs Dry">
<style>
:root{
  --bg:#eef2f7; --card:#fff; --ink:#1b2430; --muted:#6b7684; --line:#dde3ea;
  --brand:#1F4E79; --brand2:#2e75b6; --pos:#1e7d45; --neg:#c0392b; --chip:#e3ebf5;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.4 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1;font-weight:600}
header small{display:block;font-size:11.5px;opacity:.8;font-weight:400}
.ib{background:rgba(255,255,255,.15);border:0;color:#fff;width:38px;height:38px;border-radius:10px;
  font-size:18px;display:grid;place-items:center;cursor:pointer}
.ib:active{background:rgba(255,255,255,.3)}
main{padding:12px 12px 32px;max-width:760px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input,select{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 10px;
  font:inherit;background:#fff;color:var(--ink);min-width:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 2px}
.chip{border:0;background:var(--chip);color:var(--brand);border-radius:999px;padding:7px 13px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--brand);color:#fff}
.full{grid-column:1/-1}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:14px;padding:10px;box-shadow:0 1px 2px rgba(0,0,0,.06);min-width:0}
.kpi span{display:block;font-size:11.5px;color:var(--muted)}
.kpi b{display:block;font-size:16px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi i{font-style:normal;font-size:11.5px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11.5px;color:var(--muted);font-weight:600;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:8px 4px;border-bottom:1px solid #f0f3f6;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td:first-child{white-space:normal;font-weight:500}
tr.tot td{font-weight:700;border-top:2px solid var(--brand);border-bottom:0;background:#f5f8fc}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.note{font-size:12.5px;color:var(--muted);text-align:center;padding:6px}
.warn{background:#fff6e0;color:#7a5600;border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px}
.err{background:#fdecea;color:#8a1f15}
#setup{display:none}
#setup p{margin:0 0 10px;font-size:14px}
.btn{width:100%;height:44px;border:0;border-radius:10px;background:var(--brand);color:#fff;font:inherit;font-weight:600;margin-top:10px;cursor:pointer}
.spin{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.seg{display:flex;flex-wrap:wrap;background:var(--chip);border-radius:10px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1 1 45%;border:0;background:transparent;color:var(--brand);font:inherit;font-size:13.5px;padding:8px 4px;border-radius:8px;cursor:pointer}
.seg button.on{background:#fff;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}
td small{display:block;font-weight:400;font-size:11.5px;color:var(--muted);margin-top:2px}
tr.go{cursor:pointer} tr.go:active td{background:#f0f5fb}
td.pc{font-size:11.5px}
#btnPdf{font-size:12px;font-weight:700;letter-spacing:.3px}
@media (max-width:420px){ header{gap:6px} .ib{width:34px;height:34px;font-size:16px} #btnPdf{font-size:11px} }
@media (max-width:380px){ .kpi b{font-size:14px} td,th{padding-left:2px;padding-right:2px} }
</style>
</head>
<body>
<header>
  <h1>Mix Theory vs Dry Real<small id="upd">NCM Material Consumption</small></h1>
  <button class="ib" id="btnImport" title="Import new reports from Drive">&#x21e9;</button>
  <button class="ib" id="btnRefresh" title="Refresh">&#x21bb;</button>
  <button class="ib" id="btnMail" title="Email the report now">&#9993;</button>
  <button class="ib" id="btnPdf" title="Export PDF / share">PDF</button>
  <button class="ib" id="btnSet" title="Settings">&#9881;</button>
</header>

<main>
  <div class="card" id="setup">
    <p><b>Data link</b><br>Paste the web-app link of the sheet (it ends with <code>?k=…</code>).</p>
    <input id="apiIn" placeholder="https://script.google.com/macros/s/…/exec?k=…" autocomplete="off">
    <button class="btn" id="apiSave">Save</button>
  </div>

  <div id="msg"></div>

  <div class="card" id="filters">
    <div class="grid">
      <div><label for="from">Date From</label><input type="date" id="from"></div>
      <div><label for="to">Date To</label><input type="date" id="to"></div>
    </div>
    <div class="chips">
      <button class="chip" data-q="this">This month</button>
      <button class="chip" data-q="last">Last month</button>
      <button class="chip" data-q="all">All</button>
    </div>
    <div class="grid" style="margin-top:10px">
      <div><label for="plant">Plant</label><select id="plant"></select></div>
      <div><label for="mix">Design Mix</label><select id="mix"></select></div>
    </div>
  </div>

  <div class="kpis">
    <div class="kpi"><span>Mix Theory</span><b id="kTh">–</b></div>
    <div class="kpi"><span>Dry Real</span><b id="kDr">–</b></div>
    <div class="kpi"><span>Difference</span><b id="kDf">–</b><i id="kPc"></i></div>
  </div>

  <div class="card">
    <div class="seg" id="seg">
      <button data-v="mixdry">Materials</button>
      <button data-v="mixdrymix">Mixes</button>
    </div>
    <table>
      <thead id="th"></thead>
      <tbody id="tb"></tbody>
    </table>
    <div class="note" id="foot"></div>
  </div>
</main>

<script>
(function(){
  var LS_API='ncm_td_api', LS_DATA='ncm_td_data', LS_F='ncm_td_filters';
  var D=null, busy=false;
  var $=function(id){return document.getElementById(id)};
  function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

  // a personal link can carry the data link after '#api=' (the part after # never reaches GitHub);
  // it is kept in the address so a Home-Screen shortcut made from it keeps working
  // short form: #k=<key> — the sheet's web-app address is below, the key never is
  var EXEC = 'https://script.google.com/macros/s/AKfycby4PN6FHViRn0O1MUyHTJCT5Sz3dKRVewc9HZn_-gQXVXyJNZctn_W6UsUUfuvmCkQCGg/exec';
  (function(){
    var m = location.hash.match(/[#&]api=([^&]+)/), k = location.hash.match(/[#&]k=([A-Za-z0-9]+)/);
    try{
      if(m) lsSet(LS_API, decodeURIComponent(m[1]));
      else if(k) lsSet(LS_API, EXEC+'?k='+k[1]);
    }catch(e){}
  })();

  // link: from the Android app if it carries one, otherwise saved on this device
  function api(){
    try{ if(window.NCMApp && NCMApp.api) { var a=NCMApp.api(); if(a) return a; } }catch(e){}
    return lsGet(LS_API)||'';
  }

  function pad(n){return (n<10?'0':'')+n}
  function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  function monthRange(off){
    var n=new Date(), a=new Date(n.getFullYear(), n.getMonth()+off, 1), b=new Date(n.getFullYear(), n.getMonth()+off+1, 0);
    return [iso(a), iso(b)];
  }
  function fmt(v){
    var a=Math.abs(v), dec = (a>=1000 || a===0) ? 0 : (a>=10 ? 1 : 2);
    return v.toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});
  }
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

  function message(html, cls){ $('msg').innerHTML = html ? '<div class="warn '+(cls||'')+'">'+html+'</div>' : ''; }

  function saveFilters(){
    lsSet(LS_F, JSON.stringify({from:$('from').value,to:$('to').value,plant:$('plant').value,mix:$('mix').value}));
  }

  function fillSelect(sel, items, keep){
    var cur = keep!=null ? keep : sel.value;
    var h='<option value="">All</option>';
    items.forEach(function(x){ h+='<option value="'+esc(x.v)+'">'+esc(x.t)+'</option>'; });
    sel.innerHTML=h;
    sel.value = items.some(function(x){return x.v===cur}) ? cur : '';
  }

  function refreshLists(keepPlant, keepMix){
    if(!D) return;
    var pl = D.plants.map(function(p,i){return {v:String(i),t:p}}).filter(function(x){return x.t})
                .sort(function(a,b){return a.t.localeCompare(b.t)});
    fillSelect($('plant'), pl, keepPlant);
    // only the mixes that actually used materials in the chosen dates + plant
    var f=$('from').value||'0000', t=$('to').value||'9999', p=$('plant').value, used={};
    D.rows.forEach(function(r){
      if(r[0]<f || r[0]>t) return;
      if(p!=='' && String(r[1])!==p) return;
      if(!D.mats[r[3]] || !(r[4]||r[5])) return;
      used[r[2]]=1;
    });
    var mx = Object.keys(used).map(function(i){return {v:i,t:D.mixes[i]}}).filter(function(x){return x.t})
                .sort(function(a,b){return a.t.localeCompare(b.t)});
    fillSelect($('mix'), mx, keepMix);
  }

  var VIEW = lsGet('ncm_td_view')==='mixdrymix' ? 'mixdrymix' : 'mixdry';   // only the Mix vs Dry views are shown
  var TH_DAYS = {};     // day|plant groups whose reports carry Theory (from Sep 2026)
  function cls(v){ return v<0?'neg':v>0?'pos':''; }
  function kpis(th, dr){
    var dft=th-dr;
    $('kTh').textContent=fmt(th); $('kDr').textContent=fmt(dr);
    $('kDf').textContent=fmt(dft); $('kDf').className=cls(dft);
    $('kPc').textContent = dr ? (dft/dr*100).toFixed(2)+'% of Dry' : '';
    $('kPc').className = $('kDf').className;
  }

  function render(){
    if(!D){ $('tb').innerHTML=''; return; }
    var f=$('from').value||'0000', t=$('to').value||'9999', p=$('plant').value, m=$('mix').value;
    document.querySelectorAll('#seg button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-v')===VIEW); });
    $('th').innerHTML = '<tr><th>'+((VIEW==='mix'||VIEW==='mixdrymix')?'Design Mix':'Material')+'</th><th>'+((VIEW==='mixdry'||VIEW==='mixdrymix')?'Mix Theory':'Theory')+'</th><th>Dry Real</th><th>Diff</th></tr>';
    if(VIEW==='mix') return renderMixes(f,t,p,m);
    if(VIEW==='mixdrymix') return renderMixDryMixes(f,t,p,m);
    if(VIEW==='mixdry') return renderMixDry(f,t,p,m);
    var agg={}, th=0, dr=0;
    D.rows.forEach(function(r){
      if(r[0]<f || r[0]>t) return;
      if(p!=='' && String(r[1])!==p) return;
      if(m!=='' && String(r[2])!==m) return;
      var a = agg[r[3]] || (agg[r[3]]=[0,0]);
      a[0]+=r[4]; a[1]+=r[5]; th+=r[4]; dr+=r[5];
    });
    var keys=Object.keys(agg).filter(function(k){return D.mats[k] && (agg[k][0]||agg[k][1])})
             .sort(function(a,b){return D.mats[a].localeCompare(D.mats[b])});
    var h='';
    keys.forEach(function(k){
      var a=agg[k], df=a[0]-a[1];
      h+='<tr><td>'+esc(D.mats[k])+'</td><td>'+fmt(a[0])+'</td><td>'+fmt(a[1])+'</td><td class="'+(df<0?'neg':df>0?'pos':'')+'">'+fmt(df)+'</td></tr>';
    });
    var dft=th-dr;
    if(keys.length) h+='<tr class="tot"><td>GRAND TOTAL</td><td>'+fmt(th)+'</td><td>'+fmt(dr)+'</td><td class="'+(dft<0?'neg':dft>0?'pos':'')+'">'+fmt(dft)+'</td></tr>';
    else h='<tr><td colspan="4" class="note">No data for this selection.</td></tr>';
    $('tb').innerHTML=h;
    kpis(th, dr);
    $('foot').textContent = (keys.length && th===0) ? 'No Theory figures in this period — the plant reports carry Theory from September 2026.' : '';
  }

  // Mix Theory (m3 from the reports x approved mix designs) vs Dry Real, per material
  function renderMixDry(f,t,p,m){
    var agg={}, th=0, dr=0, has=false;
    D.rows.forEach(function(r){
      if(r.length < 8) return;                         // older data link without mix theory
      has=true;
      if(r[0]<f || r[0]>t) return;
      if(p!=='' && String(r[1])!==p) return;
      if(m!=='' && String(r[2])!==m) return;
      if(!r[6] && !r[7]) return;
      var a = agg[r[3]] || (agg[r[3]]=[0,0]);
      a[0]+=r[6]; a[1]+=r[7]; th+=r[6]; dr+=r[7];
    });
    var keys=Object.keys(agg).filter(function(k){ return D.mats[k] && (agg[k][0]||agg[k][1]); })
             .sort(function(a,b){ return D.mats[a].localeCompare(D.mats[b]); });
    var h='';
    keys.forEach(function(k){
      var a=agg[k], df=a[0]-a[1], pc=a[0] ? df/a[0]*100 : null;
      h+='<tr><td>'+esc(D.mats[k])+(pc===null?'':'<small><span class="'+cls(df)+'">'+(pc>0?'+':'')+pc.toFixed(2)+'%</span></small>')+'</td><td>'+fmt(a[0])+'</td><td>'+fmt(a[1])+'</td><td class="'+cls(df)+'">'+fmt(df)+'</td></tr>';
    });
    var dft=th-dr;
    if(keys.length) h+='<tr class="tot"><td>GRAND TOTAL<small><span class="'+cls(dft)+'">'+(th?((dft>0?'+':'')+(dft/th*100).toFixed(2)+'%'):'')+'</span></small></td><td>'+fmt(th)+'</td><td>'+fmt(dr)+'</td><td class="'+cls(dft)+'">'+fmt(dft)+'</td></tr>';
    else h='<tr><td colspan="4" class="note">'+(has?'No data for this selection (mix designs start September 2026).':'Tap ↻ to refresh — needs the updated sheet script.')+'</td></tr>';
    $('tb').innerHTML=h;
    kpis(th, dr);
    $('foot').textContent = keys.length ? 'Mix Theory = m³ in the reports × approved mix designs · only mixes that have a design are counted · ICE is in Dry, Water in Theory.' : '';
  }

  // per mix: Mix Theory (approved designs) vs Dry Real, biggest difference first; tap = that mix's materials
  function renderMixDryMixes(f,t,p,m){
    var mx={}, th=0, dr=0;
    D.rows.forEach(function(r){
      if(r.length < 8) return;
      if(r[0]<f || r[0]>t) return;
      if(p!=='' && String(r[1])!==p) return;
      if(m!=='' && String(r[2])!==m) return;
      if(!r[6] && !r[7]) return;
      var o = mx[r[2]] || (mx[r[2]]={th:0, dr:0, mat:{}});
      o.th+=r[6]; o.dr+=r[7]; th+=r[6]; dr+=r[7];
      var nm=D.mats[r[3]]; if(nm==='ICE' || nm==='Water') nm='Water+ICE';   // the designs have no ice, it is part of Water
      o.mat[nm]=(o.mat[nm]||0)+r[6]-r[7];
    });
    var keys=Object.keys(mx).filter(function(k){ return D.mixes[k] && Math.round(mx[k].th-mx[k].dr)!==0; })
      .sort(function(a,b){ return Math.abs(mx[b].th-mx[b].dr) - Math.abs(mx[a].th-mx[a].dr); });
    var h='';
    keys.forEach(function(k){
      var o=mx[k], df=o.th-o.dr, pc=o.th ? df/o.th*100 : 0, big='', bv=0;
      if(Math.abs(pc)<0.005) pc=0;
      Object.keys(o.mat).forEach(function(n){ if(Math.abs(o.mat[n])>Math.abs(bv)){ bv=o.mat[n]; big=n; } });
      h+='<tr class="go" data-k="'+k+'"><td>'+esc(D.mixes[k])+
         '<small><span class="'+cls(df)+'">'+(pc>0?'+':'')+pc.toFixed(2)+'%</span>'+
         (big ? ' · mostly '+esc(big)+' <span class="'+cls(bv)+'">'+(bv>0?'+':'')+fmt(bv)+'</span>' : '')+'</small></td>'+
         '<td>'+fmt(o.th)+'</td><td>'+fmt(o.dr)+'</td><td class="'+cls(df)+'">'+fmt(df)+'</td></tr>';
    });
    var dft=th-dr;
    if(keys.length) h+='<tr class="tot"><td>TOTAL ('+keys.length+' mixes)</td><td>'+fmt(th)+'</td><td>'+fmt(dr)+'</td><td class="'+cls(dft)+'">'+fmt(dft)+'</td></tr>';
    else h='<tr><td colspan="4" class="note">No differences in this selection (mix designs start September 2026).</td></tr>';
    $('tb').innerHTML=h;
    kpis(th, dr);
    $('foot').textContent = keys.length ? 'Mix Theory = m³ × approved mix designs · ICE counted with Water · tap a mix to see its materials.' : '';
    document.querySelectorAll('#tb tr.go').forEach(function(tr){ tr.addEventListener('click', function(){
      $('mix').value = tr.getAttribute('data-k');
      if($('mix').value !== tr.getAttribute('data-k')) return;
      VIEW='mixdry'; lsSet('ncm_td_view', VIEW); saveFilters(); render(); window.scrollTo(0,0);
    }); });
  }

  // mixes whose Theory and Dry Real differ, biggest difference first
  function renderMixes(f,t,p,m){
    var mx={}, th=0, dr=0;
    D.rows.forEach(function(r){
      if(r[0]<f || r[0]>t) return;
      if(p!=='' && String(r[1])!==p) return;
      if(m!=='' && String(r[2])!==m) return;
      if(!TH_DAYS[r[0]+'|'+r[1]]) return;              // only days that have Theory
      var o = mx[r[2]] || (mx[r[2]]={th:0, dr:0, mat:{}});
      o.th+=r[4]; o.dr+=r[5]; th+=r[4]; dr+=r[5];
      var nm=D.mats[r[3]]; if(nm==='ICE' || nm==='Water') nm='Water+ICE';   // reports put the ice inside Water's Theory
      o.mat[nm]=(o.mat[nm]||0)+r[4]-r[5];
    });
    var keys=Object.keys(mx).filter(function(k){ return D.mixes[k] && Math.round(mx[k].th-mx[k].dr)!==0; })
      .sort(function(a,b){ return Math.abs(mx[b].th-mx[b].dr) - Math.abs(mx[a].th-mx[a].dr); });
    var h='';
    keys.forEach(function(k){
      var o=mx[k], df=o.th-o.dr, pc=o.dr ? df/o.dr*100 : 0, big='', bv=0;
      if(Math.abs(pc)<0.005) pc=0;
      Object.keys(o.mat).forEach(function(n){ if(Math.abs(o.mat[n])>Math.abs(bv)){ bv=o.mat[n]; big=n; } });
      h+='<tr class="go" data-k="'+k+'"><td>'+esc(D.mixes[k])+
         '<small><span class="'+cls(df)+'">'+(pc>0?'+':'')+pc.toFixed(2)+'%</span>'+
         (big ? ' · mostly '+esc(big)+' <span class="'+cls(bv)+'">'+(bv>0?'+':'')+fmt(bv)+'</span>' : '')+'</small></td>'+
         '<td>'+fmt(o.th)+'</td><td>'+fmt(o.dr)+'</td><td class="'+cls(df)+'">'+fmt(df)+'</td></tr>';
    });
    var dft=th-dr;
    if(keys.length) h+='<tr class="tot"><td>TOTAL ('+keys.length+' mixes)</td><td>'+fmt(th)+'</td><td>'+fmt(dr)+'</td><td class="'+cls(dft)+'">'+fmt(dft)+'</td></tr>';
    else h='<tr><td colspan="4" class="note">No differences in this selection'+(th||dr?'':' (no Theory figures — they start September 2026)')+'.</td></tr>';
    $('tb').innerHTML=h;
    kpis(th, dr);
    $('foot').textContent = keys.length ? 'Only days with Theory are compared · ICE counted with Water · tap a mix to see its materials.' : '';
    document.querySelectorAll('#tb tr.go').forEach(function(tr){ tr.addEventListener('click', function(){
      $('mix').value = tr.getAttribute('data-k');
      if($('mix').value !== tr.getAttribute('data-k')) return;
      VIEW='mat'; lsSet('ncm_td_view', VIEW); saveFilters(); render(); window.scrollTo(0,0);
    }); });
  }

  function setData(d){
    D=d; $('upd').textContent='Updated '+d.updated;
    TH_DAYS={}; d.rows.forEach(function(r){ if(r[4]>0) TH_DAYS[r[0]+'|'+r[1]]=1; });
    var s={}; try{ s=JSON.parse(lsGet(LS_F)||'{}') }catch(e){}
    refreshLists(s.plant, s.mix); render();
  }

  function load(keepMsg){
    var a=api();
    if(!a){ $('setup').style.display='block'; return; }
    if(busy) return; busy=true;
    $('btnRefresh').classList.add('spin');
    fetch(a, {cache:'no-store', redirect:'follow'})
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d.error){ throw new Error(d.error==='unauthorized' ? 'The link key is wrong — open settings and paste the link again.' : d.error); }
        var n=new Date(); d.updated = iso(n)+' '+pad(n.getHours())+':'+pad(n.getMinutes());   // phone's own clock
        lsSet(LS_DATA, JSON.stringify(d)); if(keepMsg!==true) message(''); setData(d);
      })
      .catch(function(e){
        message((D ? 'Showing the last saved data. ' : '')+'Could not load: '+esc(e.message||e), D?'':'err');
      })
      .then(function(){ busy=false; $('btnRefresh').classList.remove('spin'); });
  }

  // ---- wiring
  var s={}; try{ s=JSON.parse(lsGet(LS_F)||'{}') }catch(e){}
  var tm=monthRange(0);
  $('from').value = s.from || tm[0]; $('to').value = s.to || tm[1];

  ['from','to'].forEach(function(id){ $(id).addEventListener('change', function(){
    document.querySelectorAll('.chip').forEach(function(c){c.classList.remove('on')});
    refreshLists(); render(); saveFilters(); }); });
  $('plant').addEventListener('change', function(){ refreshLists(); render(); saveFilters(); });
  $('mix').addEventListener('change', function(){ render(); saveFilters(); });
  document.querySelectorAll('.chip').forEach(function(c){ c.addEventListener('click', function(){
    var q=c.getAttribute('data-q'), r = q==='this'?monthRange(0) : q==='last'?monthRange(-1) : ['',''];
    if(q==='all' && D && D.rows.length){ var mn='9999',mxd='0000'; D.rows.forEach(function(x){ if(x[0]<mn)mn=x[0]; if(x[0]>mxd)mxd=x[0]; }); r=[mn,mxd]; }
    $('from').value=r[0]; $('to').value=r[1];
    document.querySelectorAll('.chip').forEach(function(o){o.classList.toggle('on', o===c)});
    refreshLists(); render(); saveFilters();
  }); });
  document.querySelectorAll('#seg button').forEach(function(b){ b.addEventListener('click', function(){
    VIEW=b.getAttribute('data-v'); lsSet('ncm_td_view', VIEW);
    if(VIEW==='mix' || VIEW==='mixdrymix'){ $('mix').value=''; saveFilters(); }      // the mixes list shows every mix
    render();
  }); });
  $('btnRefresh').addEventListener('click', load);

  // ✉ : open the phone's own mail app with the report already written (what is on screen, same filters).
  // The user sends it from his own mailbox - no server, no Google, no office PC.
  var MAIL_TO = 'a.salah@edncm.com';
  function dm2(s){ return s ? s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4) : ''; }
  // what is on screen (same filters): Mix Theory vs Dry per material + top 5 mixes — used by ✉ and PDF
  function reportData(){
    if(!D) return null;
    var f=$('from').value||'0000', t=$('to').value||'9999', p=$('plant').value, m=$('mix').value;
    var mats={}, mixes={}, T=0, R=0, first='', last='';
    D.rows.forEach(function(r){
      if(r.length < 8 || r[0]<f || r[0]>t) return;
      if(p!=='' && String(r[1])!==p) return;
      if(m!=='' && String(r[2])!==m) return;
      if(!r[6] && !r[7]) return;
      var a=mats[r[3]]||(mats[r[3]]=[0,0]); a[0]+=r[6]; a[1]+=r[7];
      var o=mixes[r[2]]||(mixes[r[2]]=[0,0]); o[0]+=r[6]; o[1]+=r[7];
      T+=r[6]; R+=r[7];
      if(!first || r[0]<first) first=r[0]; if(r[0]>last) last=r[0];
    });
    if(!T && !R) return null;
    var rows=Object.keys(mats).filter(function(k){ return D.mats[k] && (mats[k][0]||mats[k][1]); })
      .sort(function(a,b){ return D.mats[a].localeCompare(D.mats[b]); })
      .map(function(k){ return {name:D.mats[k], th:mats[k][0], dr:mats[k][1]}; });
    var top=Object.keys(mixes).filter(function(k){ return D.mixes[k] && Math.round(mixes[k][0]-mixes[k][1])!==0; })
      .sort(function(a,b){ return Math.abs(mixes[b][0]-mixes[b][1])-Math.abs(mixes[a][0]-mixes[a][1]); }).slice(0,5)
      .map(function(k){ return {name:D.mixes[k], th:mixes[k][0], dr:mixes[k][1]}; });
    return {first:first, last:last, T:T, R:R, rows:rows, top:top,
            scope:'Plant: '+(p===''?'All':D.plants[p])+(m===''?'':' · Mix: '+D.mixes[m]),
            title:'NCM - Mix Theory vs Dry '+dm2(first)+' to '+dm2(last)};
  }
  function pct(df,th){ return th ? (df>0?'+':'')+(df/th*100).toFixed(2)+'%' : ''; }

  $('btnMail').addEventListener('click', function(){
    var d=reportData(); if(!d){ message('Nothing to send for this selection.'); return; }
    var pc=function(df,th){ return th ? ' ('+pct(df,th)+')' : ''; };
    var L=[];
    L.push('Mix Theory vs Dry Real');
    L.push(dm2(d.first)+' to '+dm2(d.last)+' · '+d.scope);
    L.push('');
    L.push('TOTAL: Mix '+fmt(d.T)+' | Dry '+fmt(d.R)+' | Diff '+fmt(d.T-d.R)+pc(d.T-d.R,d.T));
    L.push('');
    L.push('By material (Mix | Dry | Diff):');
    d.rows.forEach(function(x){ var df=x.th-x.dr; L.push('- '+x.name+': '+fmt(x.th)+' | '+fmt(x.dr)+' | '+fmt(df)+pc(df,x.th)); });
    if(d.top.length){
      L.push(''); L.push('Mixes with the biggest difference:');
      d.top.forEach(function(x){ var df=x.th-x.dr; L.push('- '+x.name+': '+fmt(df)+pc(df,x.th)); });
    }
    L.push(''); L.push('Mix Theory = m3 in the plant reports x approved mix designs. ICE is in Dry only (the designs count it inside Water).');
    var subject=d.title;
    var url='mailto:'+MAIL_TO+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(L.join('\n'));
    window.__lastMail=url;                            // kept for testing
    location.href=url;
  });

  // PDF: built on the phone (jsPDF), then the share sheet -> Mail/Outlook attaches it. Falls back to a download.
  // The libraries are loaded ahead of time: the share sheet must open straight from the tap (iPhone rule).
  (function(){
    ['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
     'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js']
    .reduce(function(prev, src){ return prev.then(function(){ return new Promise(function(ok){
      var s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=ok; document.head.appendChild(s); }); }); }, Promise.resolve());
  })();
  function latin(s){ return String(s).replace(/[^\x20-\x7E -ÿ]/g, '?'); }   // built-in PDF fonts have no Cyrillic
  function buildPdf(d){
    var doc = new window.jspdf.jsPDF({unit:'pt', format:'a4'}), red=[192,57,43], green=[30,125,69];
    doc.setFont('helvetica','bold'); doc.setFontSize(17); doc.setTextColor(31,78,121);
    doc.text('Mix Theory vs Dry Real', 40, 50);
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(107,118,132);
    doc.text(latin(dm2(d.first)+' to '+dm2(d.last)+'  ·  '+d.scope), 40, 68);
    var col = function(v){ return v<0 ? red : (v>0 ? green : [27,36,48]); };
    var body = d.rows.map(function(x){ var df=x.th-x.dr; return [latin(x.name), fmt(x.th), fmt(x.dr), fmt(df), pct(df,x.th)]; });
    var dft=d.T-d.R;
    body.push(['GRAND TOTAL', fmt(d.T), fmt(d.R), fmt(dft), pct(dft,d.T)]);
    doc.autoTable({startY:80, head:[['Material','Mix Theory','Dry Real','Difference','%']], body:body, theme:'grid',
      styles:{fontSize:9.5, cellPadding:5, lineColor:[227,232,239]}, headStyles:{fillColor:[31,78,121], halign:'right'},
      columnStyles:{0:{halign:'left'},1:{halign:'right'},2:{halign:'right'},3:{halign:'right'},4:{halign:'right'}},
      didParseCell:function(c){
        if(c.section==='head' && c.column.index===0) c.cell.styles.halign='left';
        if(c.section!=='body') return;
        var last = c.row.index===body.length-1;
        if(last){ c.cell.styles.fontStyle='bold'; c.cell.styles.fillColor=[242,246,251]; }
        if(c.column.index>=3){ var v = last ? dft : d.rows[c.row.index].th-d.rows[c.row.index].dr; c.cell.styles.textColor=col(v); }
      }});
    if(d.top.length){
      var y = doc.lastAutoTable.finalY + 26;
      doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(31,78,121);
      doc.text('Mixes with the biggest difference', 40, y);
      doc.autoTable({startY:y+8, head:[['Design Mix','Difference','%']],
        body:d.top.map(function(x){ var df=x.th-x.dr; return [latin(x.name), fmt(df), pct(df,x.th)]; }), theme:'grid',
        styles:{fontSize:9.5, cellPadding:5, lineColor:[227,232,239]}, headStyles:{fillColor:[31,78,121], halign:'right'},
        columnStyles:{0:{halign:'left'},1:{halign:'right'},2:{halign:'right'}},
        didParseCell:function(c){
          if(c.section==='head' && c.column.index===0) c.cell.styles.halign='left';
          if(c.section==='body' && c.column.index>=1){ var x=d.top[c.row.index]; c.cell.styles.textColor=col(x.th-x.dr); }
        }});
    }
    var fy = doc.lastAutoTable.finalY + 20;
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(107,118,132);
    doc.text(doc.splitTextToSize('Mix Theory = m3 in the plant reports x approved mix designs. Only mixes that have a design are counted. '+
      'Red = more used than the design. ICE is in Dry Real only (the designs count it inside Water).', 515), 40, fy);
    return doc;
  }
  $('btnPdf').addEventListener('click', function(){
    var d=reportData(); if(!d){ message('Nothing to export for this selection.'); return; }
    if(!window.jspdf || !window.jspdf.jsPDF || !window.jspdf.jsPDF.API.autoTable){ message('PDF tools are still loading — try again in a few seconds.', 'err'); return; }
    var doc=buildPdf(d), name=d.title.replace(/[\/\\:]/g,'-')+'.pdf';
    var file=null; try{ file=new File([doc.output('blob')], name, {type:'application/pdf'}); }catch(e){}
    if(file && navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({files:[file], title:d.title}).catch(function(){});   // pick Mail / Outlook -> PDF attached
    } else {
      doc.save(name);
      message('PDF downloaded — attach it to an email.');
    }
  });

  // pull new plant reports from the Drive folder now (same job as the 7 AM run)
  var importing=false;
  $('btnImport').addEventListener('click', function(){
    var a=api(); if(!a || importing) return;
    importing=true; $('btnImport').classList.add('spin');
    message('Importing new reports from Drive… this can take a minute.');
    fetch(a+(a.indexOf('?')>-1?'&':'?')+'run=import&fmt=json', {cache:'no-store', redirect:'follow'})
      .then(function(r){ return r.json(); })
      .then(function(r){
        if(r.error) throw new Error(r.error);
        if(r.mats){ message('The sheet script is an older version — redeploy it (Manage deployments → New version) to use this button.', 'err'); return; }
        if(r.busy){ message('An import is already running — try again in 2 minutes.'); return; }
        if(!r.files){ message('No new reports in the Drive folder.'); return; }
        message('Imported '+r.files+' file(s), '+r.rows+' new rows'+(r.filled?', '+r.filled+' Theory cells filled':'')+
                (r.added.length?': '+esc(r.added.join(', ')):'')+(r.left?' — '+r.left+' more will finish in a minute.':'.'));
        load(true);
      })
      .catch(function(e){ message('Import failed: '+esc(e.message||e), 'err'); })
      .then(function(){ importing=false; $('btnImport').classList.remove('spin'); });
  });
  $('btnSet').addEventListener('click', function(){
    var st=$('setup'); st.style.display = st.style.display==='block' ? 'none' : 'block';
    $('apiIn').value = lsGet(LS_API)||'';
  });
  $('apiSave').addEventListener('click', function(){
    var v=$('apiIn').value.trim(); if(!v) return;
    lsSet(LS_API, v); $('setup').style.display='none'; load();
  });

  var cached=null; try{ cached=JSON.parse(lsGet(LS_DATA)||'null') }catch(e){}
  if(cached && cached.rows) setData(cached);
  load();
})();
</script>
</body>
</html>
